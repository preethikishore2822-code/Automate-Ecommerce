name: Test Automation workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '00 18 * * *'
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run test automation framework with Maven
        run: mvn test -DsuiteXmlFile=src/test/resources/testng.xml -Dbrowser=chrome -DisHeadless=true

      - name: Upload Test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test logs
          path: logs/

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test Reports
          path: reports.html

      - name: Test Execution status
        if: always()
        run: echo "Test execution completed"
