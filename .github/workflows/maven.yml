name: Test Automation workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '00 18 * * *'
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run test automation framework with Maven
        run: mvn test -DsuiteXmlFile=src/test/resources/testng.xml -Dbrowser=chrome -DisHeadless=true

      - name: Upload Test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test logs
          path: logs/

      - name: upload screenshots as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshot
          path: screenshots/

      - name: Upload HTML Reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test Reports
          path: reports.html

      - name: Test Execution status
        if: always()
        run: echo "Test execution completed"

      - name: Copy report to gh-page folder
        if: always()
       run: |
        mkdir -p public
        cp reports.html public/index.html
        cp -R screenshots public/screenshots
        ls -l public

      - name: Deploy to GitHub Pages
       if: always()
       uses: JamesIves/github-pages-deploy-action@v4
       with:
          folder: public
          token: ${{ secrets.PAT }}
          branch: gh-pages
          clean: true

          
